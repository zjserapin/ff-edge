[project]
name = "ff-edge"
version = "0.1.0"
description = "Free-data fantasy football research foundation for 2026 redraft"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    # 1.43.0 and 1.43.1 are yanked upstream. Neither caused the pyarrow crash
    # below — that was measured and ruled out — but running a release its own
    # authors pulled is not a thing to do ten days before a draft.
    "polars>=1.43.2",
    # !=25.0.0 is load bearing. That release segfaults the interpreter inside
    # `pandas_compat` when a frame is converted between pandas and Arrow, which
    # is what `st.dataframe` does to every table in app.py. No traceback, no
    # error page — the server dies. Nine consecutive draft-day dry runs died on
    # the ninth pick; the same walk on 25.0.1 survived eight runs plus a reverse
    # pass. Fixed upstream in 25.0.1, so this excludes one release rather than
    # holding the floor down. `tests/test_display.py` fails loudly if it comes
    # back through a stale lock.
    "pyarrow>=15.0,!=25.0.0",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "fastmcp>=3.0",
    "streamlit>=1.40",
    "altair>=5.4",
    # Promoted out of the notebook group: clustering and the breakout backtest
    # are part of the app now, not exploratory work.
    "scikit-learn>=1.5",
    "anthropic>=0.120.2",
    "pydantic>=2.13.4",
]

[dependency-groups]
notebook = [
    "jupyter",
    "matplotlib",
    "seaborn",
]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo is not an installed package (package = false), so pytest needs the
# root on sys.path the same way `uv run python -m src.x` gets it.
pythonpath = ["."]
