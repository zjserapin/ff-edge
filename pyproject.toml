[project]
name = "ff-edge"
version = "0.1.0"
description = "Free-data fantasy football research foundation for 2026 redraft"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "fastmcp>=3.0",
    "streamlit>=1.40",
    "altair>=5.4",
    # Promoted out of the notebook group: clustering and the breakout backtest
    # are part of the app now, not exploratory work.
    "scikit-learn>=1.5",
]

[dependency-groups]
notebook = [
    "jupyter",
    "matplotlib",
    "seaborn",
]

[tool.uv]
package = false
