{# Generic frame renderer. Expects `t` = format.table_ctx(...) #}
<div class="table-wrap">
  <table class="data">
    <thead>
      <tr>
        {% for h in t.headers %}
        <th {% if h.help %}title="{{ h.help }}"{% endif %} {% if h.num %}class="num"{% endif %}>{{ h.label }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in t.rows %}
      <tr>
        {% for cell in row %}
        <td {% if t.headers[loop.index0].num %}class="num"{% endif %}>{{ cell }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
